name: Build Maya AI Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Generate Maya AI APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Platform Tools
      uses: android-actions/setup-android@v3

    - name: Download and Setup Gradle 9.3.1
      run: |
        wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
        unzip -q gradle-9.3.1-bin.zip

    - name: Compile Maya AI APK (assembleDebug)
      run: |
        ./gradle-9.3.1/bin/gradle assembleDebug --stacktrace --no-daemon

    - name: Upload Maya AI APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Maya-AI-Mark-XXXIX-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0-build-${{ github.run_number }}
        name: "Maya AI Mark-XXXIX Mobile Release (Build ${{ github.run_number }})"
        body: |
          ### 🚀 Maya AI Mark-XXXIX - Official Android Release
          
          **Features Included:**
          - 🎙️ Real-time Gemini Live Female Voice (Aoede/Leda)
          - 📞 Phone Calling & 💬 WhatsApp Automation
          - 🔦 Torch, 🔋 Battery, 🔊 Volume, ⏰ Alarms & App Launchers
          - 🔍 Deep Web Research & Intelligence
          - 💎 Mark-XXXIX Arc Reactor Hologram HUD
          
          **Download the attached `.apk` below and install directly on your Android phone!**
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
